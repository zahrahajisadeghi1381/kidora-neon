<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت نام | Kidora</title>

    <link rel="stylesheet" href="register.css">

</head>


<body>

    <div class="container">


        <div class="logo">
            Kidora
        </div>


        <h1>
            ایجاد حساب جدید
        </h1>


        <p class="description">
            به جمع کاربران ما بپیوندید
        </p>


        <form>

            <div class="input-box">

                <input
                    type="text"
                    id="name"
                    placeholder=" "
                    required
                >

                <label for="name">
                    نام و نام خانوادگی
                </label>

            </div>


            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    placeholder=" "
                    required
                >

                <label for="email">
                    آدرس ایمیل
                </label>

            </div>


            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder=" "
                    required
                >

                <label for="password">
                    رمز عبور
                </label>

            </div>


            <div class="input-box">

                <input
                    type="password"
                    id="confirm"
                    placeholder=" "
                    required
                >

                <label for="confirm">
                    تکرار رمز عبور
                </label>

            </div>


            <label class="remember">

                <input
                    type="checkbox"
                    required
                >

                <span>
                    قوانین سایت را می پذیرم
                </span>

                <a href="#">
                    مطالعه قوانین
                </a>

            </label>


            <button
                class="btn"
                type="submit"
            >
                ثبت نام
            </button>

        </form>


        <div class="divider">
            <span>یا ثبت نام با</span>
        </div>


        <div class="social">

            <button type="button">
                Google
            </button>

            <button type="button">
                GitHub
            </button>

        </div>


        <div class="login">

            قبلاً حساب دارید؟

            <a href="login.html">
                وارد شوید
            </a>

        </div>


        <a href="index.html" class="back-home">
            ← بازگشت به صفحه اصلی
        </a>


    </div>

</body>

</html>
